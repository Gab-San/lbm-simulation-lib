# Check: ensure_compatible must reject backend = "cuda" when the binary is
# compiled with BACKEND = ExecutionBackend::OPEN_MP.
# Syntactic parsing succeeds (backend is a valid value for
# parse_execution_backend); the expected error comes from the comparison in
# ensure_compatible, with a message that includes execution_backend_to_string.

[[conf]]
collision = "BGK"
backend   = "openmp"

[conf.lattice]
size = [129, 129]

[conf.physics]
reynolds = 100.0
size     = [0.1, 0.0]

[conf.solver]
niters  = 100000
nframes = 200

[conf.output]
frames  = "output/should_not_run.vtk"
profile = "output/should_not_run.dat"

