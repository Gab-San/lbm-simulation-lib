# Weak scaling: the work per thread is held constant, so the lattice grows with
# the thread count instead of staying fixed. Ideal weak scaling shows up as a
# FLAT wall-time curve; whatever slope appears is parallel overhead plus the
# growing memory footprint.
#
# The cost of one LBM iteration is proportional to the number of cells, and
# niters is the same everywhere, so "constant work per thread" means
#
#     nx * ny  ~  n_threads * 129^2
#
# i.e. each side scales as sqrt(n_threads). Sides are rounded to the nearest odd
# value, which keeps a true centre cell for the centreline profile:
#
#     threads   side   cells     cells/thread   deviation from 129^2
#        1      129     16641      16641.0          0.00%
#        2      183     33489      16744.5         +0.62%
#        4      257     66049      16512.2         -0.77%
#        8      365    133225      16653.1         +0.07%
#       16      515    265225      16576.6         -0.39%
#       32      729    531441      16607.5         -0.20%
#       64     1031   1062961      16608.8         -0.19%
#
# Note that with reynolds and the lid velocity fixed, nu = u0 * ny / Re grows
# with the lattice, so tau differs between blocks. That changes the physics but
# not the cost: an LBM iteration does the same arithmetic per cell whatever tau
# is, which is what a scaling study measures. It stays stable throughout, since
# tau only moves further above the 0.5 floor as the grid grows.
#
# Run it with:  bash submit_weak.sh [REPS]

[[conf]]

[conf.lattice]
size = [129, 129]

[conf.physics]
reynolds = 100.0
size     = [0.1, 0.0]

[conf.solver]
niters  = 100000
nframes = 200

[conf.output]
frames  = "out/weak_dump.out"
profile = "out/time/weak_result1.dat"

[conf.backend]
n_threads = 1

