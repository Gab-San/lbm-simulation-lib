# Poiseuille 2D, canale 129x129, BGK.
#
# Il salto di pressione fra inlet e outlet NON si mette qui: lo calcola il
# main dalla soluzione analitica del canale (pin - pout = 8*nu*u*Nx/Ny^2),
# quindi non e' un parametro libero.

[problem]
type = "poiseuille"

[grid]
nx = 129
ny = 129
# niente nz -> configurazione 2D

[physics]
collision = "BGK"
reynolds = 100.0

# init_vel_x non muove nessuna parete in Poiseuille: e' la velocita'
# caratteristica con cui si ricava nu = u*Ny/Re, e da nu il tau del
# collision operator. Con questi valori:
#   nu  = 0.1 * 129 / 100 = 0.129
#   tau = 0.5 + 3*nu      = 0.887
# che sta dentro l'intervallo di stabilita' (0.55 - 1.2) su cui
# CollisionParams emette warning: nessun avviso atteso.
init_vel_x = 0.1
init_vel_y = 0.0

[solver]
# Il transitorio verso il profilo parabolico e' diffusivo, dell'ordine di
# H^2/nu = 128^2/0.129 ~ 1.3e5 passi: sotto le ~1e5 iterazioni il profilo
# non e' ancora a regime e l'errore L2 contro PoiseuilleSolution2D resta
# alto senza che ci sia niente di sbagliato.
niters = 100000
nframes = 200
backend = "openmp"
